<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Botones</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <h1>Ejercicio 100 botones</h1>
    <section>
      <h2>Categoría 1. Fundamentos y colores — básico</h2>
      <button class="btn btn-primary">Primario</button>
      <button class="btn btn-secondary">Secundario</button>
      <button class="btn btn-success">Éxito</button>
      <button class="btn btn-danger">Peligro</button>
      <button class="btn btn-warning">Advertencia</button>
      <button class="btn btn-info">Información</button>
      <button class="btn btn-dark">Oscuro</button>
      <button class="btn btn-light">Claro</button>
      <button class="btn btn-text">Texto</button>
      <button class="btn btn-custom">Personalizado</button>
    </section>

    <section>
      <h2>Categoría 2. Bordes, tamaños y formas — básico</h2>
      <button class="btn btn-outline">Contorno</button>
      <button class="btn btn-border-thick">Borde grueso</button>
      <button class="btn btn-border-dashed">Borde discontinuo</button>
      <button class="btn btn-border-dotted">Borde punteado</button>
      <button class="btn btn-rounded">Esquinas redondeadas</button>
      <button class="btn btn-pill">Píldora</button>
      <button class="btn btn-circle">Circular</button>
      <button class="btn btn-small">Pequeño</button>
      <button class="btn btn-large">Grande</button>
      <button class="btn btn-full">Ancho completo</button>
    </section>

    <section>
      <h2>Categoría 3. Tipografía y sombras — básico a intermedio</h2>
      <button class="btn btn-uppercase">Mayúsculas</button>
      <button class="btn btn-spaced">Espaciado</button>
      <button class="btn btn-bold">Negrita</button>
      <button class="btn btn-elegant">Elegante</button>
      <button class="btn btn-underline">Subrayado</button>
      <button class="btn btn-shadow-soft ">Sombra suave</button>
      <button class="btn btn-shadow-strong">Sombra pronunciada </button>
      <button class="btn btn-shadow-color">Sombra de color</button>
      <button class="btn btn-relief">Relieve</button>
      <button class="btn btn-text-glow ">Texto brillante</button>
    </section>
  </body>
</html>
